name: GitHub Actions CI

on: 
  push:
    branches: 
    - stable
    - develop
  pull_request:
    branches: 
    - develop

jobs:

  linux:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_JOBNAME: ${{ matrix.jobname }}
      GH_OS: Linux
    strategy:
      fail-fast: false
      matrix:
        jobname: [
          ubuntu22-gcc,
          ubuntu22-clang,
        ]
        include:
        - jobname: ubuntu22-gcc
          container: 
            image: ghcr.io/philipfackler/xolotl-ci:ubuntu22-dev
            options: -u root 
        - jobname: ubuntu22-clang
          container: 
            image: ghcr.io/philipfackler/xolotl-ci:ubuntu22-dev
            options: -u root

    steps:
    - name: Checkout Action
      uses: actions/checkout@v1

    - name: Configure
      run: CI/scripts/run_step.sh configure

    - name: Build
      run: CI/scripts/run_step.sh build

    - name: Test
      run: CI/scripts/run_step.sh test


  macos:
    runs-on: macos-latest
    env:
      GH_YML_JOBNAME: ${{ matrix.jobname }}
      GH_YML_OS: macOS

    strategy:
      fail-fast: false
      matrix:
        jobname: [
          macos1015-xcode11 
        ]

    steps:
    - name: Checkout Action
      uses: actions/checkout@v1

    - name: Setup Dependencies
      run: |
        brew install boost open-mpi hdf5-mpi make python@3.10
        echo "PATH=/opt/homebrew/opt/python@3.10/libexec/bin:$PATH" >> $GITHUB_ENV

    - name: Configure
      run: |
        export EXTRA_CMAKE_ARGS='-DXolotl_INCLUDE_RN_TPP_FILES=ON -DXolotl_ENABLE_TIMER_TESTS=OFF'
        CI/scripts/run_step.sh configure
      env:
        PATH: ${{ env.PATH }}

    - name: Build
      run: CI/scripts/run_step.sh build

    - name: Test
      run: CI/scripts/run_step.sh test
